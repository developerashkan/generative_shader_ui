name: generative_shader_ui
description: >-
  GPU shader widgets: auto skeleton loader, liquid glass, particles, Siri orb
  and waves, neon buttons, ripples, reveal transitions. No GLSL needed.
version: 1.1.0
homepage: https://github.com/developerashkan/generative_shader_ui
repository: https://github.com/developerashkan/generative_shader_ui
issue_tracker: https://github.com/developerashkan/generative_shader_ui/issues
documentation: https://github.com/developerashkan/generative_shader_ui#readme

topics:
  - shaders
  - animation
  - skeleton
  - shimmer
  - glassmorphism

screenshots:
  - description: Gallery of generative_shader_ui GPU shader widgets - Siri orb, neon buttons, progress, auto skeleton loader and liquid glass.
    path: doc/screenshots/gallery.png
  - description: ShaderSkeleton generates shimmering skeleton bones from your real layout, then cross-fades to the content.
    path: doc/screenshots/skeleton.gif
  - description: LiquidGlass panels with blurred, saturated backdrop, rim light and iridescent edges over a living gradient.
    path: doc/screenshots/glass.png
  - description: Motion widgets - ShaderPulse rings, LiquidWaves gauge, ShaderRipple, ShaderReveal transitions and ShaderShimmer.
    path: doc/screenshots/motion.gif
  - description: ParticleField styles - snow, embers, fireflies, bokeh, rain, confetti and warp - plus LiquidWaves.
    path: doc/screenshots/particles.png
  - description: Siri-style fluid orb and voice waves reacting to live audio amplitude.
    path: doc/screenshots/siri.gif
  - description: Animated neon buttons and shader progress indicators.
    path: doc/screenshots/controls.png
  - description: Aurora background with animated mesh gradient text and cards.
    path: doc/screenshots/aurora.png

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/mesh_gradient.frag
    - shaders/siri_orb.frag
    - shaders/siri_wave.frag
    - shaders/neon_border.frag
    - shaders/circular_progress.frag
    - shaders/linear_progress.frag
    - shaders/aurora.frag
    - shaders/skeleton.frag
    - shaders/shimmer.frag
    - shaders/glass.frag
    - shaders/particles.frag
    - shaders/ripple.frag
    - shaders/pulse.frag
    - shaders/liquid_waves.frag
    - shaders/reveal.frag
