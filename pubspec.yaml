name: generative_shader_ui
description: >-
  Drop-in GPU shader widgets: Siri-style fluid orb and voice waves, neon
  buttons, animated mesh gradients, aurora and glowing progress indicators.
  No GLSL needed.
version: 1.0.0
homepage: https://github.com/developerashkan/generative_shader_ui
repository: https://github.com/developerashkan/generative_shader_ui
issue_tracker: https://github.com/developerashkan/generative_shader_ui/issues
documentation: https://github.com/developerashkan/generative_shader_ui#readme

topics:
  - shaders
  - animation
  - gradient
  - ui
  - widget

screenshots:
  - description: Gallery of generative_shader_ui widgets - Siri orb, waves, neon buttons, mesh gradients and glowing progress.
    path: doc/screenshots/gallery.png
  - description: Siri-style fluid orb and voice waves reacting to live audio amplitude.
    path: doc/screenshots/siri.gif
  - description: Animated neon buttons, neon containers and shader progress indicators.
    path: doc/screenshots/controls.png
  - description: Aurora background with animated mesh gradient text and cards.
    path: doc/screenshots/aurora.png

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/mesh_gradient.frag
    - shaders/siri_orb.frag
    - shaders/siri_wave.frag
    - shaders/neon_border.frag
    - shaders/circular_progress.frag
    - shaders/linear_progress.frag
    - shaders/aurora.frag
